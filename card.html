<body>
            <h1>Про проєкт</h1>
            <div class='about-wrapper'>
                <p>Вітаємо гостей інтернет сайту туристичного агентства “Танго Тревел”!</p>
                <p>Наша компанія — відомий український туроператор. Наша основна спеціальність — організація подорожей Україною, а також по країнах Європи та Америки.</p>

        <section class='section2' id='team'>
            <h1>Команда</h1>
            <div class='team-wrapper'>
                <div class='team-item team1'>

                    <div class='team-item-bottom'>
                        <h2>Артем</h2>
                        <p>Перший гід в нашій компанії.</p>
                    </div>
            
                    </div>
                </div>
            </div>
        </section>
        <section class='section3' id='rules'>
            <h1>Правила</h1>
            <div class='rules-wrapper'>
      
            </div>
        </section>
        <section class='section4' id='submit'>
            <h1>Заявка</h1>
            <div class='submit-wrapper'>
                <form action="/submit_form" method="POST">
                    <label for="name">Ім'я:</label>
                    <input type="text" id="name" name="name" required><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br>
                    <label for="tour">Тур:</label>
                    <select id="tour" name="tour" required>
                        <option value="tour1">Тур 1</option>
                        <option value="tour2">Тур 2</option>
                        <option value="tour3">Тур 3</option>
                    </select><br>
                    <input type="submit" value="Надіслати">
                </form>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
